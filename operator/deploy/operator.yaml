apiVersion: v1
kind: Namespace
metadata:
  name: mlaccel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ebpf-p4-operator
rules:
- apiGroups: ["mlaccel.io"]
  resources: ["gradientaggregations", "gradientaggregations/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebpf-p4-operator
  namespace: mlaccel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ebpf-p4-operator
subjects:
- kind: ServiceAccount
  name: ebpf-p4-operator
  namespace: mlaccel-system
roleRef:
  kind: ClusterRole
  name: ebpf-p4-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebpf-p4-operator
  namespace: mlaccel-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ebpf-p4-operator
  template:
    metadata:
      labels:
        app: ebpf-p4-operator
    spec:
      serviceAccountName: ebpf-p4-operator
      containers:
      - name: manager
        image: ebpf-p4-operator:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: BPFD_GRPC_ADDR
          value: "bpfd.bpfd.svc:50051"
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi