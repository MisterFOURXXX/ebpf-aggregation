apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gradientaggregations.mlaccel.io
spec:
  group: mlaccel.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              workers:
                type: integer
              aggregationMode:
                type: string
                enum: ["ebpf-only", "p4-only", "hybrid"]
              smartNICSelector:
                type: object
                properties:
                  model:
                    type: string
              eBPFPolicy:
                type: object
                properties:
                  priority:
                    type: string
              metrics:
                type: array
                items:
                  type: string
          status:
            type: object
            properties:
              phase:
                type: string
              bpfProgramLoaded:
                type: boolean
              p4ProgramLoaded:
                type: boolean
              message:
                type: string
    subresources:
      status: {}
    scope: Namespaced
    names:
      plural: gradientaggregations
      singular: gradientaggregation
      kind: GradientAggregation