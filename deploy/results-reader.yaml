apiVersion: v1
kind: Pod
metadata:
  name: ebpf-p4-reader
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: reader
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: results
      mountPath: /results
  volumes:
  - name: results
    persistentVolumeClaim:
      claimName: ebpf-p4-results